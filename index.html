<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drakeharbour Syndicates</title>
<link rel="preload" href="fonts/cinzel.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="img/map.webp" as="image">
<link rel="preload" href="img/logo.webp" as="image">
<link rel="preload" href="img/cardback.webp" as="image">
<link rel="stylesheet" href="river.css?v=122">
<link rel="stylesheet" href="icons.css?v=122">
</head>
<body>
<div id="stage">
  <div id="map"><canvas id="mapfx"></canvas><canvas id="mapfolk"></canvas></div>
  <div id="notice" class="parchment"></div>
  <section id="town"></section>
  <div id="brand"><img src="img/logo-small.webp" alt="Drakeharbour Syndicates"></div>
  <div id="final">Final round</div>
  <div id="mixer" class="parchment hidden"></div>
  <div id="opps"></div>
  <div id="menu">
    <div class="row"><button class="btn parch small" id="btn-hint" title="What would a strong player do now?">Hint</button><button class="btn parch small" id="btn-rules">Rules</button><button class="btn parch small" id="btn-menu">Menu</button></div>
    <div class="row"><button class="btn parch small icon" id="btn-fs-down" title="Smaller text">A&minus;</button><button class="btn parch small icon" id="btn-fs-up" title="Bigger text">A+</button><button class="btn parch small icon" id="btn-music"></button><button class="btn parch small icon" id="btn-sound"></button><button class="btn parch small icon" id="btn-full"></button></div>
  </div>

  <section id="offers" class="leather"><div class="zone-title">Charters<br>on offer<button class="mini" id="btn-reoffer" title="Put these Charters to the bottom of their deck and turn up fresh ones (1 stamina)">Fresh</button></div><div id="offer"></div></section>
  <section id="charters" class="leather"><div class="zone-title">Founded charters</div><div id="founded"></div></section>
  <section id="tavern" class="leather"><div class="zone-title">The Tavern <span id="qmore"></span><button class="mini" id="btn-request">Fresh</button></div><div id="qrow"></div><div id="qsealed"></div></section>
  <section id="chronicle" class="parchment" title="Click to read everything that has happened"><div class="panel-title">Chronicle</div><div id="log"></div></section>

  <section id="board" class="leather">
    <div id="me-char"></div>
    <div id="me-renown"></div>
    <div id="me-ap"></div>
    <div id="me-res"></div>
    <div id="me-cap"></div>
    <div id="status"></div>
    <div id="piles">
      <div class="pile" id="deck"><div class="slot"></div><div class="lbl">Deck</div></div>
      <div class="pile" id="discard"><div class="slot"></div><div class="lbl">Discard</div></div>
    </div>
    <div id="hand"></div>
    <div id="actions">
      <button class="btn" id="btn-cast"><i class="ic ic-cast"></i>Cast</button>
      <button class="btn dark" id="btn-clear">Clear</button>
      <button class="btn dark" id="btn-undo" title="Take back your last move (Ctrl+Z)">Undo</button>
      <span class="spacer"></span>
      <div id="sortbar">SORT <button class="btn dark small" id="sort-suit">Suit</button><button class="btn dark small" id="sort-rank">Rank</button></div>
      <span class="spacer"></span>
      <button class="btn" id="btn-end"><i class="ic ic-discard"></i>Discard &amp; end turn</button>
    </div>
    <div id="my-quests"></div>
  </section>

  <div id="title" class="hidden">
    <div class="t-art"></div>
    <div class="t-logo">
      <img class="t-mark" src="img/logo.webp" alt="Drakeharbour Syndicates">
      <div class="t-sub">charters, quests and cards in a guild town</div>
    </div>
    <nav id="title-menu"></nav>
    <div id="title-foot"></div>
  </div>
  <div id="coach" class="parchment"></div>
  <div id="overlay" class="hidden"><div id="panel" class="parchment"></div></div>
  <div id="tip"></div>
</div>
<script src="river-music.js?v=122"></script>
<script src="river-core.js?v=122"></script>
<script src="river-ai.js?v=122"></script>
<script src="river-tutorial.js?v=122"></script>
<script src="folk-sheet.js?v=122"></script>
<script src="river-scenery.js?v=122"></script>
<script src="river-app.js?v=122"></script>
</body>
</html>
